<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Lists</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <h1>🍳 Kitchen Lists</h1>
            <p class="login-subtitle">Select your name to continue</p>
            <select id="userSelect" class="user-select">
                <option value="">-- Select User --</option>
            </select>
            <div id="passwordSection" style="display: none;">
                <input type="password" id="passwordInput" class="password-input" placeholder="Enter password" />
            </div>
            <button id="loginBtn" class="login-btn">Login</button>
        </div>
    </div>

    <!-- Main App (hidden until logged in) -->
    <div id="mainApp" class="container" style="display: none;">
        <header>
            <h1>🍳 Kitchen Lists</h1>
            <div class="user-info-bar">
                <span id="userWelcome" class="user-welcome"></span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </header>

        <!-- Manager Controls -->
        <div id="managerControls" class="manager-controls" style="display: none;">
            <div class="manager-section">
                <button id="dashboardBtn" class="view-btn active">📊 Dashboard</button>
                <button id="checklistsBtn" class="view-btn">📝 Manage Checklists</button>
                <button id="manageUsersBtn" class="manage-users-btn">👥 Manage Users</button>
            </div>
        </div>

        <!-- Dashboard View (for managers/admins) -->
        <div id="dashboardView" class="dashboard-view" style="display: none;">
            <h2>Today's Activity</h2>
            <div class="dashboard-stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalChecklistsCount">0</div>
                    <div class="stat-label">Total Checklists</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedChecklistsCount">0</div>
                    <div class="stat-label">Completed Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completionPercentage">0%</div>
                    <div class="stat-label">Completion Rate</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalTasksCompletedCount">0</div>
                    <div class="stat-label">Tasks Completed Today</div>
                </div>
            </div>

            <h3>Completion by User</h3>
            <div id="userCompletionStats" class="user-completion-stats">
                <!-- User completion stats will be populated here -->
            </div>
        </div>

        <!-- Checklist Management View -->
        <div id="checklistManagementView" class="checklist-management-view" style="display: none;">
            <!-- Employee Filter -->
            <div id="employeeFilter" class="employee-filter" style="display: none;">
                <label for="employeeSelect">Filter by:</label>
                <select id="employeeSelect" class="employee-select">
                    <option value="all">All</option>
                </select>
            </div>

            <div class="checklist-manager">
                <div class="new-checklist-section">
                    <input type="text" id="newChecklistInput" placeholder="Create a new checklist..." />
                    <button id="addChecklistBtn">+ New Checklist</button>
                </div>
            </div>

            <div class="tabs" id="checklistTabs">
                <!-- Checklists will be dynamically added here -->
            </div>

            <div class="checklist-container">
                <div class="checklist-header">
                    <h2 id="currentChecklistName">Select a checklist</h2>
                    <button id="deleteChecklistBtn" class="delete-checklist-btn" style="display: none;">Delete Checklist</button>
                </div>

                <div class="add-item-section">
                    <input type="text" id="newItemInput" placeholder="Add a new task..." />
                    <select id="taskTypeSelect" class="task-type-select">
                        <option value="checkbox">Checkbox</option>
                        <option value="temperature">Temperature</option>
                        <option value="text">Text Input</option>
                    </select>
                    <button id="addItemBtn">Add</button>
                </div>

                <div id="checklistItems" class="checklist-items">
                    <!-- Items will be dynamically added here -->
                </div>

                <div class="stats">
                    <span id="statsText">0 tasks total</span>
                </div>
            </div>
        </div>
    </div>

    <!-- User Management Modal -->
    <div id="userModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Users</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="add-user-section">
                    <h3>Add New User</h3>
                    <input type="text" id="newUsername" placeholder="Enter name" />
                    <select id="newUserRole" class="user-role-select">
                        <option value="employee">Employee</option>
                        <option value="manager">Manager</option>
                    </select>
                    <input type="password" id="newUserPassword" class="new-user-password" placeholder="Password (for managers only)" style="display: none;" />
                    <button id="addUserBtn" class="add-user-btn">Add User</button>
                </div>
                <div class="user-list-section">
                    <h3>Current Users</h3>
                    <div id="userList" class="user-list">
                        <!-- User list will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
